name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup signing keystore
        id: keystore
        run: |
          # 1. Ensure root debug.keystore is present so debugConfig doesn't fail validation
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Configure release keystore
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore_file=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "keystore_password=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_file=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_OUTPUT"
            echo "keystore_password=android" >> "$GITHUB_OUTPUT"
            echo "key_alias=androiddebugkey" >> "$GITHUB_OUTPUT"
            echo "key_password=android" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-android-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TeleDrive-android-release
          path: artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
            TAG="v1.5.0-${SHORT_SHA}"
            PRERELEASE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TeleDrive ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
